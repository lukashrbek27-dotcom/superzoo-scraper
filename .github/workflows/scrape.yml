name: Scrape SuperZoo produkty

on:
  schedule:
    - cron: '0 4 * * *'  # Každé pondělí ve 4:00
  workflow_dispatch:       # Manuální spuštění z GitHubu

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalace závislostí
        run: npm install

      - name: Instalace Playwright prohlížečů
        run: npx playwright install chromium --with-deps

      - name: Spustit scraper
        run: node scraper.js

      - name: Commit a push products.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Update products $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
