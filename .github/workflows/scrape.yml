name: Scrape SuperZoo produkty

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superzoo-review-global
  cancel-in-progress: false

jobs:
  scrape-review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      REVIEW_DIR: ${{ runner.temp }}/superzoo-review
      PREFLIGHT_DIR: ${{ runner.temp }}/superzoo-baseline-preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Create temporary review directories
        run: mkdir -p "$REVIEW_DIR" "$PREFLIGHT_DIR"

      - name: Prepare immutable baseline preflight
        run: node prepare-review-snapshot.js --output="$PREFLIGHT_DIR/baseline-preflight-raw.json" --report="$PREFLIGHT_DIR/baseline-contract.json"

      - name: Validate immutable baseline preflight
        run: node validate-raw.js --input="$PREFLIGHT_DIR/baseline-preflight-raw.json" --report="$PREFLIGHT_DIR/baseline-validation.json"

      - name: Remove derived baseline payload
        if: always()
        run: rm -f "$PREFLIGHT_DIR/baseline-preflight-raw.json"

      - name: Install Playwright Chromium system dependencies
        run: npx playwright install chromium --with-deps

      - name: Scrape into temporary staging
        run: node scraper.js --output="$REVIEW_DIR/superzoo-raw.json" --failure-report="$REVIEW_DIR/scrape-failure.json"

      - name: Validate raw staging output
        run: node validate-raw.js --input="$REVIEW_DIR/superzoo-raw.json" --report="$REVIEW_DIR/raw-validation.json"

      - name: Convert into temporary staging
        run: node convert-superzoo.js --input="$REVIEW_DIR/superzoo-raw.json" --output="$REVIEW_DIR/superzoo-converted-review.json"

      - name: Validate converted staging output
        run: node validate-converted.js --input="$REVIEW_DIR/superzoo-converted-review.json" --report="$REVIEW_DIR/converted-validation.json"

      - name: Create validation summary
        if: always()
        run: node generate-review-report.js --baseline="$PREFLIGHT_DIR/baseline-validation.json" --raw="$REVIEW_DIR/raw-validation.json" --converted="$REVIEW_DIR/converted-validation.json" --failure="$REVIEW_DIR/scrape-failure.json" --output="$REVIEW_DIR/validation-summary.md"

      - name: Upload validated review artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: superzoo-review-valid-${{ github.run_id }}
          path: ${{ runner.temp }}/superzoo-review/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superzoo-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/superzoo-review/
            ${{ runner.temp }}/superzoo-baseline-preflight/baseline-contract.json
            ${{ runner.temp }}/superzoo-baseline-preflight/baseline-validation.json
          if-no-files-found: warn
          retention-days: 14
