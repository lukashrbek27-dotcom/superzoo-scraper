name: SuperZoo scheduled managed-price producer

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superzoo-managed-price-review
  cancel-in-progress: false

jobs:
  managed-price:
    name: Produce validated SuperZoo price evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout scraper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout authoritative application catalog
        uses: actions/checkout@v4
        with:
          repository: lukashrbek27-dotcom/mazlicek-plus
          ref: 467a67fd0afca9644fabd8a761c5c0d1efe3b5b0
          token: ${{ secrets.SUPERZOO_CATALOG_READ_TOKEN }}
          path: app-catalog
          persist-credentials: false
          sparse-checkout: |
            src/data/partner-foods.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run offline safety and contract tests
        run: npm test

      - name: Bind checked-out commits
        shell: bash
        run: |
          set -euo pipefail
          scraper_commit="$(git rev-parse HEAD)"
          catalog_commit="$(git -C app-catalog rev-parse HEAD)"
          test "$scraper_commit" = "$GITHUB_SHA"
          test "$catalog_commit" = "467a67fd0afca9644fabd8a761c5c0d1efe3b5b0"
          printf 'SUPERZOO_SCRAPER_COMMIT=%s\n' "$scraper_commit" >> "$GITHUB_ENV"
          printf 'SUPERZOO_CATALOG_COMMIT=%s\n' "$catalog_commit" >> "$GITHUB_ENV"

      - name: Create unique create-only review directory
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/superzoo-managed-price-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
          printf 'SUPERZOO_MANAGED_OUTPUT_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Run full technical scraper
        run: |
          node scraper.js \
            --output="$SUPERZOO_MANAGED_OUTPUT_ROOT/superzoo-raw.json" \
            --review-sidecar="$SUPERZOO_MANAGED_OUTPUT_ROOT/review-sidecar.json" \
            --failure-report="$SUPERZOO_MANAGED_OUTPUT_ROOT/scrape-failure.json"

      - name: Build and validate managed-price candidate
        run: |
          npm run validate:managed-price -- \
            --raw="$SUPERZOO_MANAGED_OUTPUT_ROOT/superzoo-raw.json" \
            --sidecar="$SUPERZOO_MANAGED_OUTPUT_ROOT/review-sidecar.json" \
            --automation-baseline="config/superzoo-automation-baseline.json" \
            --catalog="app-catalog/src/data/partner-foods.json" \
            --output-dir="$SUPERZOO_MANAGED_OUTPUT_ROOT"

      - name: Verify provenance and bind PASS artifacts
        shell: bash
        run: |
          set -euo pipefail
          node lib/superzoo-managed-price-provenance.js \
            --raw="$SUPERZOO_MANAGED_OUTPUT_ROOT/superzoo-raw.json" \
            --sidecar="$SUPERZOO_MANAGED_OUTPUT_ROOT/review-sidecar.json" \
            --candidate="$SUPERZOO_MANAGED_OUTPUT_ROOT/superzoo-managed-price-candidate.json" \
            --validation="$SUPERZOO_MANAGED_OUTPUT_ROOT/superzoo-managed-price-validation.json" \
            --baseline="config/superzoo-automation-baseline.json" \
            --catalog="app-catalog/src/data/partner-foods.json" \
            --output="$SUPERZOO_MANAGED_OUTPUT_ROOT/superzoo-managed-price-provenance.json" \
            --run-id="$GITHUB_RUN_ID" \
            --run-attempt="$GITHUB_RUN_ATTEMPT" \
            --repository="$GITHUB_REPOSITORY" \
            --workflow-ref="$GITHUB_WORKFLOW_REF" \
            --scraper-commit="$SUPERZOO_SCRAPER_COMMIT" \
            --catalog-commit="$SUPERZOO_CATALOG_COMMIT"

      - name: Write managed-price job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output_root="${SUPERZOO_MANAGED_OUTPUT_ROOT:-}"
          report=""
          if [ -n "$output_root" ]; then
            report="$output_root/superzoo-managed-price-validation.json"
          fi
          if [ -n "$report" ] && [ -f "$report" ]; then
            node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(`# ${r.verdict}`); console.log(`- Managed coverage: ${r.managedCoverage.observed}/${r.managedCoverage.required}`); console.log(`- Changed managed: ${r.changedManaged}`); console.log(`- No-op: ${r.passed && r.changedManaged === 0}`); console.log(`- Blockers: ${r.blockers.map(x=>x.code+":"+x.count).join(", ") || "none"}`); console.log(`- Remote actions: ${JSON.stringify(r.remoteActions)}`);' "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# SuperZoo managed-price producer ended before creating a managed-price report' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload managed-price evidence
        if: ${{ always() && env.SUPERZOO_MANAGED_OUTPUT_ROOT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: superzoo-managed-price-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SUPERZOO_MANAGED_OUTPUT_ROOT }}/
          if-no-files-found: warn
          retention-days: 14
